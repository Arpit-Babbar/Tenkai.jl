# Source - https://github.com/ranocha/Julia_User_Group_Mainz/tree/main/2025-01-09__Infrastructure_GitHub_pkg_dev
name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Cancel redundant CI tests automatically
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.tenkai_test }} - ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.12'
          # - 'nightly'
        os:
          - ubuntu-latest
        arch:
          - x64
        tenkai_test:
            - part_1
            - crk_imex_paper
        include: # TODO - This repetition should be avoidable
            - os: macOS-latest
              arch: aarch64
              version: '1.10'
              tenkai_test: part_1
            - os: macOS-latest
              arch: aarch64
              version: '1.10'
              tenkai_test: crk_imex_paper
            - os: windows-latest
              arch: x64
              version: '1.10'
              tenkai_test: part_1
            - os: windows-latest
              arch: x64
              version: '1.10'
              tenkai_test: crk_imex_paper

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        env:
          TENKAI_TEST: ${{ matrix.tenkai_test }}

  gpu:
    # Metal.jl is macOS-only, so it lives in its own test/gpu/Project.toml
    # (not the shared test/Project.toml) and gets its own job/env here
    # instead of running through the `test` matrix above. GitHub's macOS
    # runners don't expose a functional Metal device, so this mainly checks
    # that Tenkai + the TenkaiMetalExt extension install, precompile, and
    # skip cleanly -- not that the kernels actually run on real hardware.
    name: GPU (Metal, install/skip smoke test)
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
          arch: aarch64
      - uses: julia-actions/cache@v3
      - run: julia --project=test/gpu -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - run: julia --project=test/gpu test/gpu/runtests.jl
